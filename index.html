<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Plan — Malmö</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-white flex flex-col items-center justify-center p-6">

  <div class="max-w-lg w-full text-center space-y-8">
    <div>
      <h1 class="text-4xl font-bold tracking-tight">Random Plan</h1>
      <p class="mt-2 text-zinc-400 text-sm">Malmö's hidden gems, one click away.</p>
    </div>

    <!-- Plan card -->
    <div id="plan-card" class="hidden bg-zinc-900 rounded-2xl p-6 text-left space-y-3 border border-zinc-800">
      <span id="plan-category" class="text-xs font-semibold uppercase tracking-widest text-indigo-400"></span>
      <h2 id="plan-title" class="text-xl font-bold"></h2>
      <p id="plan-description" class="text-zinc-300 text-sm leading-relaxed"></p>
      <div class="flex gap-3 pt-2">
        <a id="plan-maps" href="#" target="_blank" rel="noopener noreferrer"
           class="text-xs bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium transition">
          Open in Maps
        </a>
        <a id="plan-source" href="#" target="_blank" rel="noopener noreferrer"
           class="text-xs text-zinc-400 hover:text-white px-4 py-2 rounded-lg border border-zinc-700 hover:border-zinc-500 transition">
          Source
        </a>
      </div>
    </div>

    <!-- Error messages -->
    <p id="error-msg" class="hidden text-red-400 text-sm"></p>

    <!-- CTA button -->
    <button id="plan-btn"
      class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold py-4 rounded-2xl text-lg transition-all duration-150 flex items-center justify-center gap-2">
      <span id="btn-text">Give Me a Plan</span>
      <span id="btn-spinner" class="hidden animate-spin">&#9696;</span>
    </button>
  </div>

  <script src="/public/app.js"></script>
</body>
</html>
